<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - MotorTec</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Motor<span>Tec</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#servicios">Servicios</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="login-box">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Iniciar sesión</h3>
          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input type="text" class="form-control" id="usuario" placeholder="Ingresa tu usuario">
              <div class="invalid-feedback">Ingresa tu usuario.</div>
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="clave" placeholder="Ingresa tu contraseña">
              <div class="invalid-feedback">Ingresa tu contraseña.</div>
            </div>
            <button type="submit" class="btn btn-dark w-100">Ingresar</button>
          </form>
        </div>
      </div>

      <!-- usuarios de prueba para el docente -->
      <div class="card mt-3">
        <div class="card-body small">
          <b>Usuarios de prueba</b>
          <table class="table table-sm mb-0 mt-2">
            <thead><tr><th>Usuario</th><th>Clave</th><th>Rol</th></tr></thead>
            <tbody>
              <tr><td>andres</td><td>cliente123</td><td>Cliente</td></tr>
              <tr><td>daniela</td><td>cliente123</td><td>Cliente</td></tr>
              <tr><td>luis</td><td>cliente123</td><td>Cliente (deshabilitado)</td></tr>
              <tr><td>admin</td><td>admin123</td><td>Administrador</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center">
    <small>MotorTec Taller Automotriz &copy; 2026</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/script.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
