<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - MotorTec</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Motor<span>Tec</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="solicitud.html">Solicitar mantenimiento</a></li>
          </ul>
          <ul class="navbar-nav align-items-lg-center" id="menuUsuario"></ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- MODULO 3: PERFIL DEL USUARIO -->
  <main>
    <div class="encabezado">
      <div class="container">
        <h2 class="mb-0">Mi perfil</h2>
      </div>
    </div>

    <div class="container mb-5">
      <div class="row g-4">
        <!-- datos del perfil -->
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title" id="perfilNombre"></h5>
              <span class="badge bg-warning text-dark mb-3" id="perfilRol"></span>
              <ul class="list-group list-group-flush" id="perfilDatos"></ul>
              <a href="solicitud.html" class="btn btn-dark w-100 mt-3">Nueva solicitud</a>
              <a href="admin.html" class="btn btn-warning w-100 mt-2 d-none" id="btnAdmin">Ir a Administración</a>
            </div>
          </div>
        </div>

        <!-- mis mantenimientos -->
        <div class="col-lg-8">
          <div class="row g-3 mb-3" id="contadores"></div>

          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h5 class="mb-0">Mis mantenimientos</h5>
                <select class="form-select form-select-sm w-auto" id="filtroEstado">
                  <option value="">Todos los estados</option>
                </select>
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr><th>#</th><th>Vehículo</th><th>Servicio</th><th>Fecha</th><th>Estado</th><th></th></tr>
                  </thead>
                  <tbody id="tablaMisSolicitudes"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center">
    <small>MotorTec Taller Automotriz &copy; 2026</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/script.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
